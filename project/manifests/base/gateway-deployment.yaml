apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    service: gateway
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      service: gateway
  template:
    metadata:
      labels:
        service: gateway
        tier: frontend
    spec:
      containers:
      - name: gateway
        image: nginx:1.25-alpine
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MENU_URL
          value: "http://menu:8080"
        - name: ORDERS_URL
          value: "http://orders:8080"
        - name: PAYMENTS_URL
          value: "http://payments:8080"
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
