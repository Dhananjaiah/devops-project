apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    service: payments
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      service: payments
  template:
    metadata:
      labels:
        service: payments
        tier: application
    spec:
      containers:
      - name: payments
        image: hashicorp/http-echo:latest
        args:
        - -text={"status":"payment_approved","transaction_id":"txn_987654","amount":"$25.99"}
        - -listen=:8080
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
