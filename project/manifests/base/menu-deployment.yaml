apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu
  labels:
    service: menu
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      service: menu
  template:
    metadata:
      labels:
        service: menu
        tier: application
    spec:
      containers:
      - name: menu
        image: hashicorp/http-echo:latest
        args:
        - -text={"menu":["pizza","burger","salad","soda"],"version":"v1"}
        - -listen=:8080
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
