apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foodcart-dev

namePrefix: dev-

commonLabels:
  environment: dev

resources:
- ../../base
- route.yaml

replicas:
- name: gateway
  count: 1
- name: menu
  count: 1
- name: orders
  count: 1
- name: payments
  count: 1

configMapGenerator:
- name: app-config
  behavior: merge
  literals:
  - LOG_LEVEL=debug
  - ENVIRONMENT=development
