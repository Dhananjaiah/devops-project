apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foodcart-prod

namePrefix: prod-

commonLabels:
  environment: prod

resources:
- ../../base
- route.yaml
- hpa.yaml
- pdb.yaml
- networkpolicies.yaml

replicas:
- name: gateway
  count: 2
- name: menu
  count: 2
- name: orders
  count: 2
- name: payments
  count: 2

configMapGenerator:
- name: app-config
  behavior: merge
  literals:
  - LOG_LEVEL=warn
  - ENVIRONMENT=production

patches:
- target:
    kind: Deployment
    name: ".*"
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "256Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "200m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "512Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "500m"
